<main class="form-wrapper">
  <form (ngSubmit)="onSubmit()" class="form" ngNativeValidate>
    <h2 class="title">New Transaction</h2>

    <div class="fields">
      <label class="field-group">Transaction
        <div class="select-wrapper">
          <select [(ngModel)]="transactionType" name="transaction-type"
            class="field select-type-transaction" required>
            <option value selected disabled>Select a transaction type</option>
            <option value="deposit">Deposit</option>
            <option value="withdraw">Withdraw</option>
          </select>
        </div>
      </label>

      <label class="field-group">
        Value
        <div class="input-wrapper">
          <input [(ngModel)]="valueTransaction" type="number" min="0.01"
            step="0.01"
            name="value"
            class="field input-transaction-value" required>
        </div>
      </label>

      <button class="button-confirm-transaction">Confirm Transaction</button>
    </div>
  </form>
</main>
